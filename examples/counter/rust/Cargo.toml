# Planned output of: gopatina build -emit-rust ./examples/counter
[package]
name = "counter"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
# Pinned runtime crate (RFC 0003); goroutines run as Tokio tasks (RFC 0002).
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }

# Reproducible-build settings (docs/REPRODUCIBLE.md).
[profile.release]
codegen-units = 1
debug = false
strip = true
incremental = false
