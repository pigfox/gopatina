name: RFC proposal
description: Propose a change to the patina language subset, its semantics or code generation.
title: "rfc: "
labels: ["rfc", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this to discuss an idea before writing a full RFC. See the RFC process in CONTRIBUTING.md
        and the template at docs/rfcs/0000-template.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph explaining the proposal.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What use cases does it support?
    validations:
      required: true
  - type: textarea
    id: sketch
    attributes:
      label: Design sketch
      description: Go input and the Rust it would lower to, if applicable.
  - type: textarea
    id: compat
    attributes:
      label: Compatibility
      description: Does this affect default (plain Go) mode, or only patina mode?
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Unresolved questions
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
