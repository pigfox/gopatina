version: 2
# Add the cargo ecosystem here when the first Cargo.toml (generated-code
# runtime crates, RFC 0003) lands; Dependabot fails on a missing manifest.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
