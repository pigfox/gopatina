name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  pr-hygiene:
    name: pr hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Pull request title is not a Conventional Commit: $TITLE"
            echo "See CONTRIBUTING.md#commit-messages"
            exit 1
          fi
      - name: DCO sign-off on every commit
        # Dependabot cannot sign off; its updates are reviewed before merging.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format=%B "$sha" | grep -Fqx "Signed-off-by: $author"; then
              echo "::error::Commit $sha has no 'Signed-off-by: $author' line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. See CONTRIBUTING.md#developer-certificate-of-origin-dco"
            exit 1
          fi
