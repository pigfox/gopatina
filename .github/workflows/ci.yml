name: CI

on:
  workflow_call:
    # toolchain-bump.yml runs these gates on its branch before it opens a PR.
    inputs:
      ref:
        description: the branch or commit to check out
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage must be 100%
        # Policy: docs/QUALITY.md#unit-tests-100-coverage-enforced
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')"
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            go tool cover -func=coverage.out | grep -v '100.0%$'
            echo "::error::Statement coverage is $total; it must be 100.0% (see docs/QUALITY.md)"
            exit 1
          fi

  float-arm64:
    # Every golden program must print Go's bits on arm64 as on amd64: gc
    # fuses float multiply-adds there (FMADD), and GoPatina fuses exactly
    # where gc reports it does (internal/fma). The Rust tests elsewhere run
    # on amd64 only.
    name: float bit for bit (macos-latest, arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Go and the generated Rust print the same output, every golden program
        env:
          GOPATINA_RUST_TESTS: "1"
        run: go test ./internal/patina -run 'TestDifferential|TestFusedArm64|TestFMASites' -timeout 50m -v

  float-amd64-v3:
    # The same on amd64 at GOAMD64=v3, where gc fuses a*b + c too
    # (VFMADD231SD): the Go builds and patina mode both take GOAMD64 from
    # the environment.
    name: float bit for bit (ubuntu-latest, GOAMD64=v3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: the runner has FMA
        run: grep -qw fma /proc/cpuinfo
      - name: Go and the generated Rust print the same output, every golden program
        env:
          GOPATINA_RUST_TESTS: "1"
          GOAMD64: v3
        run: go test ./internal/patina -run 'TestDifferential' -timeout 50m -v

  float-amd64-no-fma:
    # math.Exp on amd64 takes another path without FMA (exp_amd64.s), which
    # Go chooses at start-up from the processor and GODEBUG (cpu.fma=off),
    # and GoPatina the same way: both programs run with FMA and with it
    # turned off, and, built static, under qemu as a Nehalem, which has
    # neither AVX nor FMA.
    name: float bit for bit (ubuntu-latest, amd64 with and without FMA, and on a Nehalem)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: math_exp, built by Go and by GoPatina, with FMA and without
        run: |
          grep -qw fma /proc/cpuinfo
          go build -o "$RUNNER_TEMP/gopatina" ./cmd/gopatina
          cd testdata/golden/math_exp
          go build -o "$RUNNER_TEMP/go-bin" .
          "$RUNNER_TEMP/gopatina" build -patina -o "$RUNNER_TEMP/patina-bin" .
          for g in "" cpu.fma=off cpu.avx=off cpu.all=off; do
            GODEBUG=$g "$RUNNER_TEMP/go-bin" > "$RUNNER_TEMP/go-$g.txt"
            GODEBUG=$g "$RUNNER_TEMP/patina-bin" > "$RUNNER_TEMP/patina-$g.txt"
            diff "$RUNNER_TEMP/go-$g.txt" "$RUNNER_TEMP/patina-$g.txt"
          done
          # The two paths ran: their results differ.
          ! cmp -s "$RUNNER_TEMP/go-.txt" "$RUNNER_TEMP/go-cpu.fma=off.txt"
      - name: install qemu and the musl target
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user
          tc=$(sed -n 's/^channel = "\(.*\)"/\1/p' examples/hello/rust/rust-toolchain.toml)
          rustup toolchain install "$tc" --profile minimal --target x86_64-unknown-linux-musl
      - name: on a processor without AVX or FMA (qemu as a Nehalem), static builds
        # The runner's glibc uses AVX itself, so a dynamically linked binary
        # dies there before its first line; Go's binaries are static, and
        # the crates are built for musl to be static too.
        run: |
          for g in math_exp math_log math_trig; do
            cd "$GITHUB_WORKSPACE/testdata/golden/$g"
            go build -o "$RUNNER_TEMP/$g-go" .
            "$RUNNER_TEMP/gopatina" build -patina -static -o "$RUNNER_TEMP/$g-patina" .
            file "$RUNNER_TEMP/$g-patina" | grep -q 'static'
            qemu-x86_64 -cpu Nehalem "$RUNNER_TEMP/$g-go" > "$RUNNER_TEMP/$g-go.txt"
            qemu-x86_64 -cpu Nehalem "$RUNNER_TEMP/$g-patina" > "$RUNNER_TEMP/$g-patina.txt"
            diff "$RUNNER_TEMP/$g-go.txt" "$RUNNER_TEMP/$g-patina.txt"
            echo "$g: same on a Nehalem"
          done

  site-layout:
    name: site never scrolls sideways on a phone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: serve gopatina.org's page locally
        run: |
          go build -o /tmp/gopatina-site ./site
          GOPATINA_SITE_ADDR=127.0.0.1:8590 /tmp/gopatina-site &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:8590/healthz && break; sleep 0.2; done
      - name: check widths 320 to 430 px on every page (scripts/site-overflow.mjs)
        # The runner image has Chrome and Node; the script uses neither
        # packages nor the network beyond the local pages. Every page of
        # the sitemap is checked, and the 404 page.
        run: |
          pages=$(curl -fs http://127.0.0.1:8590/sitemap.xml | grep -o '<loc>[^<]*' | sed 's|<loc>https://gopatina.org/|/|')
          for p in $pages /no-such-page; do
            echo "== $p"
            node scripts/site-overflow.mjs "$(command -v google-chrome)" "http://127.0.0.1:8590$p"
          done

  fuzz:
    name: fuzz (parser, checker, emitter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: go test -fuzz
        # A fixed time budget (docs/QUALITY.md). A failing input is written
        # under the package's testdata/fuzz directory; commit it as a
        # regression test.
        run: |
          go test -run '^$' -fuzz FuzzCheck -fuzztime 60s ./internal/subset
          go test -run '^$' -fuzz FuzzBorrow -fuzztime 60s ./internal/borrow
          go test -run '^$' -fuzz FuzzEmit -fuzztime 60s ./internal/emit

  pr-hygiene:
    name: pr hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Pull request title is not a Conventional Commit: $TITLE"
            echo "See CONTRIBUTING.md#commit-messages"
            exit 1
          fi
      - name: DCO sign-off on every commit
        # Dependabot cannot sign off; its updates are reviewed before merging.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format=%B "$sha" | grep -Fqx "Signed-off-by: $author"; then
              echo "::error::Commit $sha has no 'Signed-off-by: $author' line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. See CONTRIBUTING.md#developer-certificate-of-origin-dco"
            exit 1
          fi
