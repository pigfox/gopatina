name: toolchain bump

# Weekly, moves the Rust toolchain emitted crates pin (toolchain.json) to the
# newest stable release, and tries the newest beta the same way:
# scripts/toolchain-bump.sh rewrites every copy of the pin on a branch, and
# every gate runs on that branch: the golden crates and Rust tests, float bit
# for bit on arm64, amd64 with FMA and amd64 without it (CI), the toolchain
# matrix and clippy (toolchains), the difftest on amd64 and arm64, and the
# benchmarks of GoPatina's crates built with the old pin and the new one, on
# the same runner (bench-compare).
# - stable: when every gate passes, it opens a pull request against main,
#   with each gate's result and the benchmark comparison in its body.
# - beta: it opens no pull request; the run warns of what the next stable
#   will break, about six weeks ahead.
# When a gate fails, it opens an issue (or comments on the open one).
#
# The pull request is opened with the workflow's own GITHUB_TOKEN, which
# starts no workflows: no checks run on the pull request itself. The gates
# in this run are its checks, and its body says so and links the run.

#
# The same for Go, daily: go-stable moves CI's pinned Go (toolchain.json,
# .go-version) to the newest release and opens a pull request when every
# gate passes; go-rc runs every gate with the newest release candidate
# (1.28rc1 first) and files an issue with the result either way.

on:
  schedule:
    - cron: "23 5 * * 2" # Tuesdays 05:23 UTC: Rust stable
    - cron: "53 5 * * 2" # Tuesdays 05:53 UTC: Rust beta
    - cron: "17 4 * * *" # daily 04:17 UTC: Go stable
    - cron: "47 4 * * *" # daily 04:47 UTC: Go release candidate
  workflow_dispatch:
    inputs:
      channel:
        description: stable or beta (Rust), go-stable or go-rc (Go)
        type: choice
        options: [stable, beta, go-stable, go-rc]
        default: stable

permissions:
  contents: read

concurrency:
  group: toolchain-bump-${{ inputs.channel || github.event.schedule }}
  cancel-in-progress: false

jobs:
  prepare:
    name: rewrite the pin (${{ inputs.channel || (github.event.schedule == '53 5 * * 2' && 'beta' || github.event.schedule == '17 4 * * *' && 'go-stable' || github.event.schedule == '47 4 * * *' && 'go-rc' || 'stable') }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
      pin: ${{ steps.pick.outputs.pin }}
      old: ${{ steps.pick.outputs.old }}
      branch: ${{ steps.push.outputs.branch }}
      sha: ${{ steps.push.outputs.sha }}
      base: ${{ steps.push.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Pick the newest release
        id: pick
        env:
          CHANNEL: ${{ inputs.channel || (github.event.schedule == '53 5 * * 2' && 'beta' || github.event.schedule == '17 4 * * *' && 'go-stable' || github.event.schedule == '47 4 * * *' && 'go-rc' || 'stable') }}
        run: |
          case "$CHANNEL" in
            go-*)
              releases="$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all')"
              if [ "$CHANNEL" = go-stable ]; then
                pin="$(printf '%s' "$releases" | jq -r '[.[] | select(.stable)][0].version | ltrimstr("go")')"
              else
                # The newest release candidate, if it is newer than every
                # stable release (go.dev lists the newest first).
                pin="$(printf '%s' "$releases" | jq -r 'if .[0].stable then "" else .[0].version | ltrimstr("go") end')"
              fi
              old="$(jq -r .go.pinned toolchain.json)"
              # Daily runs try each release once: skip one this channel's
              # branch already carries.
              if [ -n "$pin" ] && git fetch -q origin "toolchain/$CHANNEL" 2>/dev/null &&
                [ "$(git show FETCH_HEAD:toolchain.json | jq -r .go.pinned)" = "$pin" ]; then
                echo "go$pin was already tried on toolchain/$CHANNEL"
                pin=""
              fi
              echo "$CHANNEL: ${pin:-none} (pinned: $old)"
              {
                echo "channel=$CHANNEL"
                echo "pin=$pin"
                echo "old=$old"
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          manifest="$(curl -fsSL "https://static.rust-lang.org/dist/channel-rust-$CHANNEL.toml")"
          if [ "$CHANNEL" = stable ]; then
            # [pkg.rustc] version = "1.101.0 (abcdef012 2026-12-10)"
            pin="$(printf '%s\n' "$manifest" | sed -n '/^\[pkg\.rustc\]$/,/^version/ s/^version = "\([0-9.]*\) .*/\1/p')"
          else
            pin="beta-$(printf '%s\n' "$manifest" | sed -n 's/^date = "\(.*\)"$/\1/p')"
          fi
          old="$(jq -r .rust.pinned toolchain.json)"
          echo "rust $CHANNEL: $pin (pinned: $old)"
          if [ -z "$pin" ] || [ "$pin" = beta- ]; then
            echo "::error::could not read the $CHANNEL manifest's version"
            exit 1
          fi
          {
            echo "channel=$CHANNEL"
            echo "pin=$pin"
            echo "old=$old"
          } >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.pick.outputs.pin }}
        if: ${{ !startsWith(steps.pick.outputs.channel, 'go-') }}
        run: rustup toolchain install "${{ steps.pick.outputs.pin }}" --profile minimal --component clippy,rustfmt
      - name: Rewrite every copy of the pin (scripts/toolchain-bump.sh, scripts/go-bump.sh)
        if: steps.pick.outputs.pin != ''
        env:
          CHANNEL: ${{ steps.pick.outputs.channel }}
          PIN: ${{ steps.pick.outputs.pin }}
        run: |
          case "$CHANNEL" in
            go-*) scripts/go-bump.sh "$PIN" ;;
            *) scripts/toolchain-bump.sh "$PIN" ;;
          esac
      - name: Push the branch
        id: push
        env:
          CHANNEL: ${{ steps.pick.outputs.channel }}
          PIN: ${{ steps.pick.outputs.pin }}
          OLD: ${{ steps.pick.outputs.old }}
        run: |
          if git diff --quiet; then
            echo "Already pinned to $PIN; nothing to try."
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$CHANNEL" in
            go-*) branch="toolchain/$CHANNEL"; subject="build(go): pin CI's Go to go$PIN"; script=go-bump.sh ;;
            *) branch="toolchain/rust-$CHANNEL"; subject="build(rust): pin emitted crates to Rust $PIN"; script=toolchain-bump.sh ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -q -F - <<EOF
          $subject

          scripts/$script $PIN, from $OLD: toolchain.json and every copy
          TestToolchainDrift checks.

          Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          EOF
          # The branch belongs to this workflow; each week's run replaces it.
          git push --force origin "$branch"
          {
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
            echo "base=$(git rev-parse HEAD~1)"
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    if: needs.prepare.outputs.branch != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  toolchains:
    needs: prepare
    if: needs.prepare.outputs.branch != ''
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/toolchains.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  bench-compare:
    name: bench, the old pin against the new
    needs: prepare
    if: needs.prepare.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: old
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: new
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Install Rust stable (the hand-written crates) and both pins
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install "$(jq -r .rust.pinned old/toolchain.json)" --profile minimal
          rustup toolchain install "$(jq -r .rust.pinned new/toolchain.json)" --profile minimal
      - name: GoPatina's crates with each pin, the same hand-written Rust
        # shipped: GoPatina's crate is built with the toolchain it pins, the
        # hand-written one with stable, so only the pin differs between runs.
        run: |
          (cd old && bench/run.sh --toolchain shipped --out "$RUNNER_TEMP/old.json")
          (cd new && GOTOOLCHAIN="go$(jq -r .go.pinned toolchain.json)" bench/run.sh --toolchain shipped --out "$RUNNER_TEMP/new.json")
      - name: Compare (a ratio 5% worse is flagged)
        env:
          OLD: ${{ needs.prepare.outputs.old }}
          NEW: ${{ needs.prepare.outputs.pin }}
        run: |
          {
            echo "| case | gopatina/rust, Rust $OLD | gopatina/rust, Rust $NEW | change | memory, $OLD | memory, $NEW |"
            echo "| --- | --- | --- | --- | --- | --- |"
            jq -r --slurpfile n "$RUNNER_TEMP/new.json" '
              .results[] as $o
              | ($n[0].results[] | select(.case == $o.case)) as $w
              | ($w.gopatina_over_rust / $o.gopatina_over_rust) as $c
              | "| \($o.case) | \($o.gopatina_over_rust) | \($w.gopatina_over_rust) | "
                + (if $c > 1.05 then "**\(($c - 1) * 100 | round)% slower: regression**"
                   elif $c < 0.95 then "\((1 - $c) * 100 | round)% faster"
                   else "within 5%" end)
                + " | \($o.memory_gopatina_over_rust) | \($w.memory_gopatina_over_rust) |"' "$RUNNER_TEMP/old.json"
          } > bench-compare.md
          cat bench-compare.md >> "$GITHUB_STEP_SUMMARY"
          cat bench-compare.md
      - uses: actions/upload-artifact@v7
        with:
          name: bench-compare
          path: bench-compare.md

  difftest-arm64:
    needs: prepare
    if: needs.prepare.outputs.branch != ''
    uses: ./.github/workflows/difftest-arm64.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      programs: "400"
      per: "200"
      strict: true

  difftest-amd64:
    name: difftest (ubuntu-latest, amd64)
    needs: prepare
    if: needs.prepare.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Install the pinned toolchain with clippy
        run: rustup toolchain install "$(jq -r .rust.pinned toolchain.json)" --profile minimal --component clippy
      - name: seed 1, programs 0-399 (CONTRIBUTING.md's gate)
        # The difftest runs the gopatina it is given; a defect (exit 3)
        # fails the gate, as on arm64.
        run: |
          go build -o "$RUNNER_TEMP/gopatina" ./cmd/gopatina
          go run ./cmd/gopatina-difftest -seed 1 -start 0 -programs 400 -per 200 -jobs 3 \
            -gopatina "$RUNNER_TEMP/gopatina"

  open-pr:
    name: open the pull request
    needs: [prepare, ci, toolchains, bench-compare, difftest-arm64, difftest-amd64]
    if: needs.prepare.outputs.branch != '' && (needs.prepare.outputs.channel == 'stable' || needs.prepare.outputs.channel == 'go-stable')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: bench-compare
      - name: The gates ran on main's tip
        # The gates tested the bump on the main it started from. If main
        # moved meanwhile, the pull request would merge a tree no gate saw.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" != "$BASE" ]; then
            echo "::error::stale base; re-dispatch: the gates ran on main $BASE, and main is now $tip"
            exit 1
          fi
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.prepare.outputs.base }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          PIN: ${{ needs.prepare.outputs.pin }}
          OLD: ${{ needs.prepare.outputs.old }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATES: |
            | gate | result |
            | --- | --- |
            | CI: lint, tests and coverage, golden crates, float bit for bit on arm64, amd64 at GOAMD64=v3 and amd64 without FMA, fuzz | ${{ needs.ci.result }} |
            | toolchains: Go stable and oldstable x Rust stable and MSRV, clippy, golden crates with the pin | ${{ needs.toolchains.result }} |
            | difftest, seed 1, programs 0-399, amd64 | ${{ needs.difftest-amd64.result }} |
            | difftest, seed 1, programs 0-399, arm64 | ${{ needs.difftest-arm64.result }} |
            | bench, the old pin against the new | ${{ needs.bench-compare.result }} |
        run: |
          if [ "$CHANNEL" = go-stable ]; then
            title="build(go): pin CI's Go to go$PIN"
            what="Moves the Go release CI pins from go$OLD to go$PIN (toolchain.json, .go-version), with the fma-sites records rewritten by scripts/go-bump.sh."
          else
            title="build(rust): pin emitted crates to Rust $PIN"
            what="Moves the Rust toolchain emitted crates pin from $OLD to $PIN (toolchain.json), with every copy rewritten by scripts/toolchain-bump.sh."
          fi
          {
            echo "$what"
            echo
            echo "## Gates"
            echo
            echo "This pull request was opened with GITHUB_TOKEN, so no checks run on it."
            echo "These gates are its checks. They ran on $SHA, the bump on main $BASE,"
            echo "in $RUN_URL. Merge it only while main is still $BASE; otherwise"
            echo "re-dispatch the workflow."
            echo
            printf '%s\n' "$GATES"
            echo "## Benchmarks"
            echo
            echo "GoPatina's crates built with the old pin and with the new one, each"
            echo "against the same hand-written Rust built with the newest stable, on one"
            echo "shared runner: ratios, not times. A change is in GoPatina's own speed"
            echo "under the new rustc. A ratio 5% worse is marked as a regression."
            echo "bench/asm-check.sh --toolchain <pin> compiles both crates with one"
            echo "rustc and shows whether hand-written Rust changed the same way, that is,"
            echo "whether the change is rustc's. Compare with BENCHMARKS.md before merging."
            echo
            cat bench-compare.md
          } > body.md
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$title" --body-file body.md
          fi

  report-failure:
    name: open an issue on a failed gate
    needs: [prepare, ci, toolchains, bench-compare, difftest-arm64, difftest-amd64]
    if: failure() && needs.prepare.outputs.channel != 'go-rc'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "ci: Rust ${{ needs.prepare.outputs.channel || 'toolchain' }} bump fails a gate"
          PIN: ${{ needs.prepare.outputs.pin }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing with Rust $PIN: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label triage \
              --body "Pinning emitted crates to Rust $PIN fails a gate: $RUN_URL. See RFC 0003."
          fi

  report-rc:
    name: report the Go release candidate
    needs: [prepare, ci, toolchains, bench-compare, difftest-arm64, difftest-amd64]
    if: always() && needs.prepare.outputs.channel == 'go-rc' && needs.prepare.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or comment on the release candidate's issue
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ needs.prepare.outputs.pin }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALL: ${{ needs.ci.result == 'success' && needs.toolchains.result == 'success' && needs.bench-compare.result == 'success' && needs.difftest-arm64.result == 'success' && needs.difftest-amd64.result == 'success' }}
          GATES: |
            | gate | result |
            | --- | --- |
            | CI, float bit for bit on three targets | ${{ needs.ci.result }} |
            | toolchains, clippy | ${{ needs.toolchains.result }} |
            | difftest, amd64 | ${{ needs.difftest-amd64.result }} |
            | difftest, arm64 | ${{ needs.difftest-arm64.result }} |
            | bench, the old pin against the new | ${{ needs.bench-compare.result }} |
        run: |
          verdict="fails a gate"
          if [ "$ALL" = true ]; then verdict="passes every gate"; fi
          title="ci: go$PIN against GoPatina"
          body="$(printf 'go%s %s: %s\n\n%s' "$PIN" "$verdict" "$RUN_URL" "$GATES")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label triage --body "$body"
          fi
