name: toolchains

# Tests GoPatina against the Go and Rust release channels (RFC 0003).
#
# - toolchains: Go {stable, oldstable} x Rust {stable, MSRV}. Required.
# - canary: Go tip, Rust beta and Rust nightly. Allowed to fail; on the
#   weekly scheduled run a failure opens an issue.
#
# The Rust side builds every golden program under testdata/golden with the
# generated crate and the toolchain of the matrix (RUSTUP_TOOLCHAIN overrides
# the crate's pinned rust-toolchain.toml), runs it, and requires the same
# output and exit status as the Go build (internal/patina/rust_test.go). One
# job also checks the committed golden crates with the pinned toolchain: no
# warnings, clippy-clean, rustfmt-clean, and gopatina verify (reproducible builds).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Minimum supported Rust version for generated crates (rust-version in
  # their Cargo.toml): 1.85 is the first release with the 2024 edition.
  RUST_MSRV: "1.85"
  # The toolchain emitted crates pin (internal/emit, rust-toolchain.toml).
  RUST_PINNED: "1.93.0"

jobs:
  toolchains:
    name: toolchains (go ${{ matrix.go }}, rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
        rust: [stable, msrv]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install Rust ${{ matrix.rust }}
        run: |
          toolchain="${{ matrix.rust }}"
          if [ "$toolchain" = msrv ]; then toolchain="$RUST_MSRV"; fi
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          echo "RUST_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain with rustfmt and clippy
        run: rustup toolchain install "$RUST_PINNED" --profile minimal --component rustfmt,clippy
      - name: Record versions
        run: |
          go version
          rustc --version
          cargo --version
      - name: go test
        run: go test -race ./...
      - name: Generated Rust, built and run with Rust ${{ matrix.rust }}
        env:
          GOPATINA_RUST_TESTS: "1"
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: go test -run 'TestDifferential|TestLibraries' -v ./internal/patina
      - name: Golden crates with the pinned toolchain (warnings, rustfmt, gopatina verify)
        if: matrix.go == 'stable' && matrix.rust == 'stable'
        env:
          GOPATINA_RUST_TESTS: "1"
        run: go test -run 'TestGoldenCratesAreClean|TestVerifyGolden' -v ./internal/patina

  rust-interop:
    # examples/rust-interop (RFC 0014): a hand-written Rust application and
    # a crate GoPatina generates from Go, built, tested and linted with
    # plain cargo, with no GoPatina tooling on the Rust side; then the crate
    # is regenerated and compared, and the Rust application is run against
    # the Go original on the same inputs.
    name: rust-interop (rust stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rust-interop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Rust stable with clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Record versions
        run: |
          go version
          rustc --version
          cargo --version
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo fmt (the hand-written application)
        run: cargo fmt --check -p quote
      - name: The generated crate matches its Go source, and Rust matches Go
        env:
          GOPATINA_RUST_TESTS: "1"
        run: go test -v .

  canary:
    name: canary (go ${{ matrix.go }}, rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { go: tip, rust: stable }
          - { go: stable, rust: beta }
          - { go: stable, rust: nightly }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Go tip
        if: matrix.go == 'tip'
        run: |
          go install golang.org/dl/gotip@latest
          gotip download
          echo "$HOME/sdk/gotip/bin" >> "$GITHUB_PATH"
      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal
          rustup default "${{ matrix.rust }}"
      - name: Record versions
        run: |
          go version
          rustc --version
      - name: go test
        run: go test -race ./...
      - name: Generated Rust, built and run with Rust ${{ matrix.rust }}
        env:
          GOPATINA_RUST_TESTS: "1"
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        run: go test -run 'TestDifferential' ./internal/patina
      - name: Open an issue on a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "ci: canary failing on go ${{ matrix.go }}, rust ${{ matrix.rust }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label triage \
              --body "The scheduled canary run failed: $RUN_URL. A coming Go or Rust release may break GoPatina; see RFC 0003."
          fi
