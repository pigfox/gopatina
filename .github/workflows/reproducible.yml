name: reproducible

# Builds each example Rust crate twice, in different directories and with
# different CARGO_HOMEs, using the reproducible-build settings in
# docs/REPRODUCIBLE.md, and fails if the two release binaries differ.
#
# examples/hello/rust is the crate gopatina emits for examples/hello;
# examples/counter/rust is still the hand-written design for goroutines
# (RFC 0002). The verify step runs gopatina verify on the hello example:
# emission is deterministic, and the -patina binary is byte-identical to a
# plain cargo build --release --locked of the emitted crate. The toolchains
# workflow runs the same check on every golden program.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-crates:
    name: reproducible rust builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          for crate in examples/*/rust; do
            (cd "$crate" && rustup show active-toolchain || rustup toolchain install)
          done
      - name: Build twice and compare sha256
        run: |
          scripts/repro-check.sh examples/*/rust 2>toolchain.txt | tee hashes.txt || { cat toolchain.txt; exit 1; }
          cat toolchain.txt
          {
            echo "### Reproducible builds"
            echo
            echo '```'
            cat hashes.txt
            cat toolchain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: gopatina verify ./examples/hello
        run: |
          go run ./cmd/gopatina verify ./examples/hello | tee verify.txt
          {
            echo "### gopatina verify ./examples/hello"
            echo
            sed 's/^/    /' verify.txt
          } >> "$GITHUB_STEP_SUMMARY"
