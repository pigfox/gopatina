name: reproducible

# Builds each example Rust crate twice, in different directories and with
# different CARGO_HOMEs, using the reproducible-build settings in
# docs/REPRODUCIBLE.md, and fails if the two release binaries differ.
#
# This checks the reproducible-build setup on hand-written crates. It does not
# test GoPatina's Rust emitter, which does not exist yet; the planned
# "gopatina verify" job will replace it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-crates:
    name: reproducible rust builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          for crate in examples/*/rust; do
            (cd "$crate" && rustup show active-toolchain || rustup toolchain install)
          done
      - name: Build twice and compare sha256
        run: |
          scripts/repro-check.sh examples/*/rust 2>toolchain.txt | tee hashes.txt || { cat toolchain.txt; exit 1; }
          cat toolchain.txt
          {
            echo "### Reproducible builds"
            echo
            echo '```'
            cat hashes.txt
            cat toolchain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
